<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Load-Bearing">
  <title>Load-Bearing</title>
  <!--
    A wall seen edge-on: a slab resting on two pillars. Same geometry as the
    rasteriser that produced apple-icon.png and favicon.ico, so all three marks
    are the same drawing.

    Themed with prefers-color-scheme: the app ships a light and a dark surface,
    and an icon that stays near-black on a dark tab strip disappears.
  -->
  <style>
    .paper { fill: #f9f9f9; }
    .ink { fill: #131316; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #131316; }
      .ink { fill: #f9f9f9; }
    }
  </style>
  <rect class="paper" width="100" height="100" rx="22" />
  <g class="ink">
    <rect x="18" y="20" width="64" height="14" rx="4" />
    <rect x="24" y="40" width="18" height="42" rx="4" />
    <rect x="58" y="40" width="18" height="42" rx="4" />
  </g>
</svg>
